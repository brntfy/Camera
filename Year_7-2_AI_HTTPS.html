<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Year 7-2 AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1022;color:#fff;font-family:Arial,sans-serif;text-align:center}
header{padding:16px;background:#151f3d}h1{margin:0;font-size:25px}.sub{color:#aeb9da;margin-top:4px}
.wrap{max-width:900px;margin:auto;padding:12px}.cam{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}canvas{position:absolute;inset:0;width:100%;height:100%}
#status{padding:14px;font-size:18px;font-weight:bold}.btn{border:0;border-radius:14px;padding:14px 22px;background:#6357f5;color:white;font-weight:bold;font-size:16px}
.card{margin-top:14px;background:#17213f;padding:15px;border-radius:15px;color:#ccd5f0}
</style>
</head>
<body>
<header><h1>🤖 Year 7-2 AI</h1><div class="sub">Face + Y Sign Detector</div></header>
<div class="wrap">
<div class="cam"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas></div>
<div id="status">Tap Start Camera</div>
<button class="btn" id="start">📷 Start Camera</button>
<div class="card">Show the <b>ASL Y sign</b> ✋<br>I'll say: <b>"Hello, my name is Nur Syazarul"</b></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

<script>
const v=document.getElementById("video"),c=document.getElementById("canvas"),x=c.getContext("2d");
const status=document.getElementById("status"); let lastSpeak=0,previousY=false;

function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z)}
function isY(l){
 const w=l[0];
 return distance(l[4],w)>distance(l[3],w)*1.12 &&
 distance(l[20],w)>distance(l[18],w)*1.12 &&
 distance(l[8],w)<distance(l[6],w)*1.10 &&
 distance(l[12],w)<distance(l[10],w)*1.10 &&
 distance(l[16],w)<distance(l[14],w)*1.10;
}

const hands=new Hands({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+f});
hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.65});

const face=new FaceDetection({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/"+f});
face.setOptions({model:"short",minDetectionConfidence:.6});

hands.onResults(r=>{
 let found=false;
 if(r.multiHandLandmarks) r.multiHandLandmarks.forEach(l=>{
   if(isY(l)) found=true;
   x.fillStyle="#00eaff";
   l.forEach(p=>{x.beginPath();x.arc(p.x*c.width,p.y*c.height,4,0,Math.PI*2);x.fill()});
 });
 if(found){
   status.textContent="🟢 Y SIGN DETECTED!";
   if(!previousY && Date.now()-lastSpeak>3000){
     lastSpeak=Date.now();
     const u=new SpeechSynthesisUtterance("Hello, my name is Nur Syazarul");
     u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);
   }
 } else status.textContent="Show the ASL Y sign ✋";
 previousY=found;
});

face.onResults(r=>{
 if(r.detections) r.detections.forEach(d=>{
   const b=d.boundingBox;
   const X=b.xCenter*c.width,Y=b.yCenter*c.height,W=b.width*c.width,H=b.height*c.height;
   x.strokeStyle="#8b7cff";x.lineWidth=4;x.strokeRect(X-W/2,Y-H/2,W,H);
   x.fillStyle="#8b7cff";x.font="bold 16px Arial";x.fillText("FACE",X-W/2,Y-H/2-7);
 });
});

async function start(){
 try{
  if(!window.isSecureContext){status.textContent="❌ Open this page using HTTPS.";return}
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
  v.srcObject=stream;
  status.textContent="🔵 Camera running...";
  v.onloadeddata=loop;
 }catch(e){
  status.textContent="❌ Camera blocked. Allow Camera permission in Chrome.";
 }
}
async function loop(){
 c.width=v.videoWidth||640;c.height=v.videoHeight||480;x.clearRect(0,0,c.width,c.height);
 await hands.send({image:v}); await face.send({image:v});
 requestAnimationFrame(loop);
}
document.getElementById("start").onclick=start;
</script>
</body>
</html>
